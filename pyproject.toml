[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kienzledoku-ocr-backfill"
version = "1.3.0"
description = "Serieller, journalisierter OCR-Backfill fuer T2med-Dokumentverweise"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Thomas Kienzle"}]
dependencies = []

[project.scripts]
kienzledoku-ocr = "kienzledoku_ocr_backfill.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
