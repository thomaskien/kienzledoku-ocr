[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kienzledoku-ocr-backfill"
version = "1.5.1"
description = "Serieller, journalisierter OCR-Backfill fuer T2med-Dokumentverweise"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Thomas Kienzle"}]
dependencies = [
  "Pillow>=9.1",
  "zxing-cpp>=2.2",
]

[project.scripts]
kienzledoku-ocr = "kienzledoku_ocr_backfill.cli:main"
kienzledoku-qr = "kienzledoku_ocr_backfill.qr_extractor:_main"
kienzledoku-pzn = "kienzledoku_ocr_backfill.bfarm_pzn:_main"
kienzledoku-amdb = "kienzledoku_ocr_backfill.t2med_amdb:_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
